[project]
name = "openagentos"
version = "0.1.0"
description = "Enterprise runtime for autonomous agents: durable execution, checkpoint recovery, idempotent side effects, observability"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.50"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
