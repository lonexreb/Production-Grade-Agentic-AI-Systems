services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openagentos
      POSTGRES_PASSWORD: openagentos  # local dev only
      POSTGRES_DB: openagentos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagentos"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
