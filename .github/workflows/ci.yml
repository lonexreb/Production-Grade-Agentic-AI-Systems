name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openagentos
          POSTGRES_PASSWORD: openagentos
          POSTGRES_DB: openagentos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U openagentos"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run python -m apps.demo.crash_demo
      - run: uv run python -m apps.hr.demo
      - run: uv run python -m apps.finance.demo
      - run: uv run python -m apps.itops.demo
      - run: uv run python -m runtime.evals benchmarks/hr
      - run: uv run python -m runtime.evals benchmarks/finance
      - run: uv run python -m apps.support.demo
      - run: uv run python -m runtime.evals benchmarks/itops
      - run: uv run python -m runtime.evals benchmarks/support
      - run: uv run python -m examples.live_problems.problem_1_hitl_double_execution
      - run: uv run python -m examples.live_problems.problem_2_retry_double_charge
      - run: uv run python -m examples.live_problems.problem_3_crash_at_step_37
